plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// ---------------------------------------------------------------------------
// Repositories. China-friendly mirrors first, official repositories as
// fallback. ModDevGradle adds the remaining required repositories (Mojang
// libraries, etc.) on its own.
// ---------------------------------------------------------------------------
repositories {
    // NeoForge / FancyModLoader artifacts (official CDN of maven.neoforged.net).
    maven {
        name = 'NeoForged-CDN'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    // BMCLAPI mirror of the Forge/NeoForge mavens (mcp_config, net.minecraftforge:*).
    maven {
        name = 'BMCLAPI'
        url = 'https://bmclapi2.bangbang93.com/maven/'
    }
    // Upstream MinecraftForge maven.
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    // Aliyun / Tencent mirrors of Maven Central.
    maven {
        name = 'Aliyun-Central'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'Tencent-Central'
        url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
    }
    // Parchment mappings (only needed if you re-enable the parchment block below).
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    // Parchment adds readable parameter names while coding. It is disabled by
    // default: maven.parchmentmc.org redirects downloads to Google Storage,
    // which is unreachable from mainland China. Uncomment this block and the
    // parchment_* entries in gradle.properties if you have a working proxy.
    //parchment {
    //    mappingsVersion = project.parchment_mappings_version
    //    minecraftVersion = project.parchment_minecraft_version
    //}

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            // -PselfTest：服务端起来后跑一遍 TrialSelfTest 的断言，任何一条失败都会让本次运行非 0 退出
            if (project.hasProperty('selfTest')) {
                systemProperty 'trial_portal.selfTest', 'true'
            }
            // -PmobCensus：启动后把注册表里的可刷怪连属性写 mob-census.tsv（给整合包配内容的取数通道）
            if (project.hasProperty('mobCensus')) {
                systemProperty 'trial_portal.mobCensus', 'true'
            }
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ---------------------------------------------------------------------------
// 整合包专用叠加层：`-PpackOverlay=xb` 时把 packOverlays/xb 一起打进 jar。
// 为什么要有这条：datapack 装在某个世界的 datapacks/ 里只对那一个存档生效，
// 新建存档就是白纸一张；而 mod jar 自带的 data 是全局生效的，开箱即有内容。
// 叠加层里写的都是某个整合包才有的实体 ID，所以它不进公开仓库（见 .gitignore），
// 默认构建（不带这个属性）出来的 jar 仍是通用版。
// ---------------------------------------------------------------------------
if (project.hasProperty('packOverlay')) {
    var overlayDir = file("packOverlays/${project.packOverlay}")
    if (!overlayDir.exists()) {
        throw new GradleException("叠加层不存在：${overlayDir}（先用 tools/census_to_pack.py --overlay ${project.packOverlay} 生成）")
    }
    // 顺序决定谁赢：Gradle 的 sourceSets 资源是"先声明的先占"（配 duplicatesStrategy=EXCLUDE），
    // 所以叠加层必须排在 src/main/resources 前面——排在后面时同名文件会被工程自带的那份挡掉，
    // 构建照样绿，jar 里却是通用内容，等于没叠（第一次试就是这个形状）。
    def baseDirs = sourceSets.main.resources.srcDirs.toList()
    sourceSets.main.resources.setSrcDirs([overlayDir] + baseDirs)
    tasks.named('processResources') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    logger.lifecycle("[packOverlay] 已把 ${overlayDir.name} 排在资源目录最前，同名文件以叠加层为准")
}

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // If you wish to declare dependencies against mods, make sure to use the 'mod*' configurations so that they're remapped.
	// See https://github.com/neoforged/ModDevGradle/blob/main/LEGACY.md#remapping-mod-dependencies for more information.
	
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // modCompileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // modCompileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // modLocalRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // modImplementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // modImplementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // modImplementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// Uncomment the lines below if you wish to configure mixin. The mixin file should be named modid.mixins.json.
/*
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}
*/

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// ---------------------------------------------------------------------------
// 数据包校验工具。src/tools/java 不会打进 jar。
// 这里刻意用 JavaExec 而不是 Test 任务：项目路径含中文，Gradle 的 Test worker
// 会因非 ASCII 路径加载不了测试类（详见 docs/开发文档.md §8）。
// ---------------------------------------------------------------------------
sourceSets {
    tools {
        java {
            srcDirs = ['src/tools/java']
        }
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = sourceSets.tools.output + sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

var checkTrialData = tasks.register("checkTrialData", JavaExec) {
    group = 'verification'
    description = '用运行期同一套模型类校验 src/main/resources/data 下的试炼与词条 JSON（不开游戏、不需要 EULA）'
    dependsOn 'compileToolsJava'
    mainClass = 'com.trialportal.tools.TrialDataCheck'
    classpath = sourceSets.tools.runtimeClasspath
    // 第二个参数给源码目录：离线门拿它和 lang 文件对账翻译键（写错的键原版只把键名印在屏幕上，不报错）
    args file('src/main/resources/data/trial_portal').absolutePath, file('src/main/java').absolutePath
}

// 带 -PpackOverlay 时，校验的对象要换成"工程内容 + 叠加层"合并后的那份——
// 光扫工程自带目录会放过叠加层里的坏内容，而进 jar 的正是合并结果。
var stageOverlayData = tasks.register("stageOverlayData", Copy) {
    group = 'verification'
    description = '把 packOverlays/<name> 盖在 src/main/resources/data 之上，产出待校验的合并树'
    // 顺序与策略要成对看：这份 Copy 实测是"后声明的覆盖先声明的"（INCLUDE=允许覆盖），
    // 所以叠加层放在 base 之后、策略用 INCLUDE；jar 那边（processResources + EXCLUDE + 叠加层在前）
    // 是"先来的赢"。两处各自成立但不通用，所以 doLast 直接把"合并树里到底是哪份 tower.json"打出来——
    // 上一版这里静默拿了工程自带的那份去校验，副本数对了、真正的叠加内容却从没被查过。
    from('src/main/resources/data')
    from("packOverlays/${project.hasProperty('packOverlay') ? project.packOverlay : 'none'}/data") {
        include '**/*'
    }
    into "${buildDir}/stagedData"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    onlyIf { project.hasProperty('packOverlay') }
    doLast {
        def staged = file("${buildDir}/stagedData/trial_portal/challenges")
        logger.lifecycle("[stageOverlayData] 合并后 challenges: ${staged.exists() ? staged.list().length : 0} 份，" +
                "trials/tower.json 来自: ${file("${buildDir}/stagedData/trial_portal/trials/tower.json").text.contains('100 层') ? '叠加层' : '工程自带（叠加层没生效！）'}")
    }
}

tasks.named('checkTrialData') {
    if (project.hasProperty('packOverlay')) {
        dependsOn stageOverlayData
        doFirst {
            args = [file("${buildDir}/stagedData/trial_portal").absolutePath, file('src/main/java').absolutePath]
        }
    }
}

tasks.named('build') {
    dependsOn checkTrialData
}

// ---------------------------------------------------------------------------
// 自测标记：runGameTestServer 在服务端注册表加载失败时仍然退 0，
// 所以「门绿」必须由 build/selftest 标记文件来背书，而不是退出码。
// ---------------------------------------------------------------------------
var selfTestMarker = file('run/selftest-result.txt')
var clearSelfTestMarker = tasks.register("clearSelfTestMarker") {
    doFirst {
        selfTestMarker.delete()
    }
}
var checkSelfTestMarker = tasks.register("checkSelfTestMarker") {
    mustRunAfter 'runGameTestServer'
    doLast {
        if (!selfTestMarker.exists()) {
            throw new GradleException('自测一条都没跑：' + selfTestMarker + ' 不存在。'
                    + '多半是服务端在注册表/数据包阶段就崩了（runGameTestServer 的退出码不会反映这件事），看 run/logs/latest.log。')
        }
        def text = selfTestMarker.text.trim()
        if (!text.contains('FAIL=0')) {
            throw new GradleException('自测未通过：' + text)
        }
        logger.lifecycle('[selfTest] ' + text)
    }
}
tasks.named('runGameTestServer') {
    dependsOn clearSelfTestMarker
    // -PmobCensus 时服务端要装下一整包的 mod，默认堆不够用
    if (project.hasProperty('mobCensus')) {
        maxHeapSize = System.getProperty('trial_portal.censusHeap', '5g')
    }
}
tasks.register('selfTest') {
    group = 'verification'
    description = '跑带模组的服务端并强制校验自测标记（PASS/FAIL），退出码不算证据'
    dependsOn 'runGameTestServer', checkSelfTestMarker
}


// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
